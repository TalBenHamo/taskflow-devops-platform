<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
</head>
<body>
    <h1>TaskFlow</h1>

    <h2>{{ project_name }}</h2>

    <p>
        Team member:
        <strong>{{ team_member }}</strong>
    </p>

    <h3>Current Tasks</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Task Name</th>
                <th>Status</th>
                <th>Assignee</th>
            </tr>
        </thead>

        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ task.name }}</td>
                <td>{{ task.status }}</td>
                <td>{{ task.assignee }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p>Application is running</p>
</body>
</html>
