replicaCount: 2

image:
  repository: ghcr.io/talbenhamo/taskflow
  tag: latest
  pullPolicy: IfNotPresent

taskflow:
  containerPort: 5000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

  podSecurityContext:
    fsGroup: 1000

  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  host: taskflow-helm.local
  path: /
  pathType: Prefix

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  database: taskflow
  username: taskflow_user
  port: 5432

  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

secrets:
  postgresPassword: ""
